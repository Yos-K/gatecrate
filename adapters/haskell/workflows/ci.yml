name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fitness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | sh scripts/check-conventional-title.sh
      - name: Enforce per-file line count limit
        run: sh scripts/check-file-line-limit.sh
      - name: Scan for committed secrets
        run: sh scripts/check-no-committed-secrets.sh
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: haskell-actions/setup@v2
        with: { ghc-version: '9.6' }
      - name: Tests gate
        run: sh scripts/run-tests.sh
