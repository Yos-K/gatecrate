# [汎用core] CI ワークフロー — スタック非依存の fitness（衛生）ゲート。
# Generic, stack-agnostic CI: it runs ONLY the core hygiene scripts (conventional PR title,
# per-file line limit, committed-secret scan), so ANY consumer — Android, Python, Node, shell —
# can drop this in and get gated PRs without an adapter. Validated end to end: this exact job
# ran green on a real pull_request in a JVM consumer (the adapter's ci.yml adds the JVM/Gradle
# test + build jobs on top of these gates).
#
# Drop into the consumer at .github/workflows/ci.yml. The scripts resolve the repo root via git
# and read FILE_LINE_PATHS / FILE_LINE_NAMES from harness.config.sh (or set them in env below).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fitness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | sh scripts/check-conventional-title.sh

      - name: Enforce per-file line count limit
        # FILE_LINE_PATHS / FILE_LINE_NAMES come from harness.config.sh; override here if needed.
        run: sh scripts/check-file-line-limit.sh

      - name: Scan for committed secrets
        run: sh scripts/check-no-committed-secrets.sh
